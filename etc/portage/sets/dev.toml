install = [
  # debuggers
  'dev-debug/gdb',
  'dev-debug/valgrind',

  # python
  'dev-python/black',
  'dev-python/numpy',
  'dev-python/uv',

  # version control
  'dev-vcs/git',
  'dev-vcs/git-lfs',

  # toolchains and build
  'sys-devel/crossdev',
  'sys-devel/mold',

  # runtimes and web
  'net-libs/nodejs',
  'www-apps/zola',
]

"package.use" = [
  # note: package.use/lang starts with a bare "*/*" with no flags
  # (a no-op in Portage); kept verbatim
  '*/*',

  # js
  'net-libs/nodejs npm',

  # rust
  'dev-lang/rust* clippy rust-analyzer rust-src rustfmt profiler',
]

"package.accept_keywords" = [
  'dev-util/shellcheck ~amd64',
]
