# browsers and mail
install = [
  'mail-client/thunderbird',
  'www-client/librewolf',
]

"package.use" = [
  # librewolf & thunderbird
  'www-client/librewolf eme-free hwaccel jumbo-build openh264 -wifi -X',
  'mail-client/thunderbird eme-free hwaccel -wifi -X',
  'media-libs/libvpx postproc',
  'media-libs/libpng apng',
]

"package.accept_keywords" = [
  '*/*::librewolf ~amd64',
  'dev-libs/nss ~amd64',
]
