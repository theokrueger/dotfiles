# osc-52
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm-256color:RGB:extkeys:clipboard:ccolour:cstyle:focus:title:strikethrough:overline:usstyle:sync"
set -as terminal-features "alacritty:RGB:extkeys:clipboard:ccolour:cstyle:focus:title:strikethrough:overline:usstyle:sync"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on
