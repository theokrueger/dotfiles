  'CFLAGS="${CFLAGS} -flto=auto"',
  'CXXFLAGS="${CXXFLAGS} -flto=auto"',
  'FFLAGS="${FFLAGS} -flto=auto"',
  'FCFLAGS="${FCFLAGS} -flto=auto"',
  'USE="${USE} lto pgo"',
]

