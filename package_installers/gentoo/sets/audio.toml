install = [
  'media-sound/pulsemixer',
  'media-video/pipewire',
]

"package.use" = [
  '*/* alsa alsa-plugin bluetooth pipewire gstreamer pulseaudio',
  'media-video/pipewire sound-server',
  'media-sound/pulseaudio -alsa-plugin -daemon',
]

"kernel.config" = [
  'CONFIG_SOUND=y',
  'CONFIG_SND=y',
  'CONFIG_SND_PROC_FS=y',
  'CONFIG_SND_VERBOSE_PROCFS=y',
]
