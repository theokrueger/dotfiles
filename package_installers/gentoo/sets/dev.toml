install = [
  # debuggers
  'dev-debug/gdb',
  'dev-debug/valgrind',

  # python
  'dev-python/black',
  'dev-python/numpy',
  'dev-python/uv',

  # dotnet
  #'dev-dotnet/dotnet-sdk-bin:8.0',
  'dev-dotnet/dotnet-sdk-bin:10.0',

  # version control
  'dev-vcs/git',
  'dev-vcs/git-lfs',

  # c/c++/cross
  'sys-devel/crossdev',
  'sys-devel/mold',

  # web
  'net-libs/nodejs',
  'www-apps/zola',
]

"package.use" = [
  'net-libs/nodejs npm',
  'dev-lang/rust* clippy rust-analyzer rust-src rustfmt profiler',
]

"package.accept_keywords" = [
  'dev-util/shellcheck ~amd64',
]
